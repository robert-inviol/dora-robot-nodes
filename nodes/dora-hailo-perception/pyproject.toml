[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dora-hailo-perception"
version = "0.1.0"
description = "A dora node for a Raspberry Pi 5 with a Hailo-8: camera, YOLOv8 detections with tracker ids, and a low-latency WebRTC live view"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# PyGObject (gi) and the hailo module come from the Pi's apt packages, not from pip.
dependencies = [
    "dora-rs>=0.3.13",
    "pyarrow>=22",
    "numpy",
    "aiohttp>=3.9",
    "aiortc>=1.9",
    "av",
]

[project.scripts]
dora-hailo-perception = "dora_hailo_perception.node:main"

[tool.hatch.build.targets.wheel]
packages = ["dora_hailo_perception"]
