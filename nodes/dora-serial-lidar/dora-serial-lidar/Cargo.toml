[package]
name = "dora-serial-lidar"
version = "0.1.0"
description = "dora node that publishes each turn of a serial lidar (LD06 or Delta-2A) as a scan"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../README.md"

[dependencies]
delta2a = { path = "../delta2a" }
ld06 = { path = "../ld06" }
# The node API has to match the version of the dora CLI that runs the dataflow.
dora-node-api = { version = "=0.3.13", default-features = false }
eyre = "0.6"
# The scan's wire type, the one definition the bridge carries.
wire-schemas = { path = "../../dora-depth-perception/wire-schemas" }
# Without the default libudev feature, so the binary links statically.
serialport = { version = "4.7", default-features = false }
