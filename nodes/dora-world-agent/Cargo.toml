[workspace]
resolver = "3"
members = ["world-model", "world-store"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
# The node API has to match the version of the dora CLI that runs the dataflow.
dora-node-api = { version = "=0.3.13", default-features = false }
eyre = "0.6"
thiserror = "2"

[profile.release]
strip = true
debug = "line-tables-only"
