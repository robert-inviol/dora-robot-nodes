[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dora-sam3-segmenter"
version = "0.1.0"
description = "A dora node that segments each keyframe into the object types it is told about, with SAM 3 on a CUDA GPU"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "dora-rs==0.3.13",
    "dora-rig-messages",
    "numpy>=2",
    "pillow>=11",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers==5.22.2",
    "accelerate>=1.10",
]

[project.scripts]
dora-sam3-segmenter = "dora_sam3_segmenter.node:main"

[tool.hatch.build.targets.wheel]
packages = ["dora_sam3_segmenter"]

# A GPU node with its own environment, kept out of the repository workspace so a robot never installs torch.
[tool.uv]
package = true

[tool.uv.sources]
dora-rig-messages = { path = "../../lib/dora-rig-messages", editable = true }
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = ["pytest>=8"]
