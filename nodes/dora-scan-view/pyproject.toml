[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dora-scan-view"
version = "0.1.0"
description = "A dora node serving a top-down map page of a planar lidar scan"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "dora-rs>=0.3.13",
    "aiohttp>=3.9",
    "dora-rig-messages",
]

[project.scripts]
dora-scan-view = "dora_scan_view.node:main"

[tool.hatch.build.targets.wheel]
packages = ["dora_scan_view"]
