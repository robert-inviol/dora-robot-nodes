<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lidar map</title>
<style>
  :root { --bg:#10141a; --panel:#1b222c; --line:#2c3644; --text:#e8edf3; --dim:#8b97a7;
          --go:#2fd27a; --stop:#e5484d; --gap:10px; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; overflow:hidden; }
  body { background:var(--bg); color:var(--text); font:15px/1.35 system-ui, sans-serif; }
  main { height:100vh; height:100dvh; padding:var(--gap); display:grid; gap:var(--gap);
         grid-template-rows:auto minmax(0, 1fr); }

  header { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0 auto 0 0; letter-spacing:.02em; white-space:nowrap; }
  .badge { padding:2px 9px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap;
           background:var(--panel); border:1px solid var(--line); color:var(--dim);
           font-variant-numeric:tabular-nums; }
  .badge.go { color:#06140c; background:var(--go); border-color:var(--go); }
  .badge.stop { color:#fff; background:var(--stop); border-color:var(--stop); }

  #view { position:relative; min-height:0; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Lidar map</h1>
    <span id="link" class="badge stop">NO LINK</span>
    <span id="lidar" class="badge">NO LIDAR</span>
  </header>
  <div id="view"></div>
</main>

<script src="/map.js"></script>
<script>
"use strict";
function showBadges({ linked, live, spinRevPerS }) {
  const link = document.getElementById("link");
  link.textContent = linked ? "LINK" : "NO LINK";
  link.className = `badge ${linked ? "go" : "stop"}`;
  const lidar = document.getElementById("lidar");
  lidar.textContent = live ? `LIDAR ${spinRevPerS.toFixed(1)} rev/s` : "NO LIDAR";
  lidar.className = `badge ${live ? "go" : ""}`;
}

LidarMap.attach(document.getElementById("view"), {
  socketUrl: `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/plane`,
  onStatus: showBadges,
});
</script>
</body>
</html>
