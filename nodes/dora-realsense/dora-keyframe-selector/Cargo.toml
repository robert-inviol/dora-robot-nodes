[package]
name = "dora-keyframe-selector"
version = "0.1.0"
description = "dora node that selects keyframes from dora-realsense's frames: depth aligned to colour, with the IMU samples since the last one"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../README.md"

[dependencies]
rgbd-keyframes = { path = "../rgbd-keyframes" }
shared-memory-outputs = { path = "../shared-memory-outputs" }
perception-wire = { path = "../../dora-depth-perception/perception-wire" }
depth-perception = { path = "../../dora-depth-perception/depth-perception" }
# The node API has to match the version of the dora CLI that runs the dataflow.
dora-node-api = { version = "=0.3.13", default-features = false }
eyre = "0.6"
glam = "0.29"
jpeg-encoder = "0.6"
