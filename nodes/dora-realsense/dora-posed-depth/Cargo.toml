[package]
name = "dora-posed-depth"
version = "0.1.0"
description = "dora node that sends depth frames downsampled for mapping, each with its exact odometry pose"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../README.md"

[dependencies]
perception-wire = { path = "../../dora-depth-perception/perception-wire" }
# The odometry node's people mask, so that both cut people out of depth by one rule.
dora-depth-inertial-odometry = { path = "../../dora-depth-perception/dora-depth-inertial-odometry" }
shared-memory-outputs = { path = "../shared-memory-outputs" }
# The node API has to match the version of the dora CLI that runs the dataflow.
dora-node-api = { version = "=0.3.13", default-features = false }
eyre = "0.6"
glam = "0.29"
thiserror = "2"
