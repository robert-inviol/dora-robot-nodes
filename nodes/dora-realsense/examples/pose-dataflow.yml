# On the camera's machine, everything the spatial server needs from it: the D455 through YOLOv8 pose on the Hailo-8,
# odometry from its depth and IMU, the people placed in 3D in the odom frame, keyframes, and posed depth frames (depth
# at its exact odometry pose, ten a second), published on rig/people_tracks, rig/odom_pose, rig/keyframe, rig/imu,
# rig/calibration and rig/posed_depth. Paths are relative to this file. Build
# `cargo build --release -p dora-realsense -p dora-keyframe-selector -p dora-posed-depth` in dora-realsense,
# `cargo build --release -p dora-depth-inertial-odometry` in dora-depth-perception, and `cargo build --release` in
# dora-people-3d and dora-zenoh-bridge; the pose node needs the Pi's hailo-all and python3-gi. Hold the camera still
# from the start until the odometry node logs that it started.
nodes:
  # The only node that opens the D455.
  - id: camera
    path: ../target/release/dora-realsense
    env:
      # This camera's calibration.json from librealsense's rs-imu-calibration.py, kept beside this file and out of git.
      IMU_CALIBRATION_PATH: imu-calibration.json
    inputs:
      # Carries nothing; it keeps the node's events open so the dataflow can stop it.
      tick: dora/timer/millis/500
      # Colour only for the frames the keyframe selector names.
      request_color: keyframes/request_color
    outputs:
      - model_input
      - depth
      - color
      - imu
      - calibration

  - id: odometry
    path: ../../dora-depth-perception/target/release/dora-depth-inertial-odometry
    inputs:
      # Every imu message is needed: the tracker integrates all of them.
      imu:
        source: camera/imu
        queue_size: 1000
      # Every frame is wanted, in order; a frame dropped here costs one pose.
      depth:
        source: camera/depth
        queue_size: 4
      # The same message every second; the first one starts the node.
      calibration:
        source: camera/calibration
        queue_size: 1
      # People found in the colour image, cut out of the depth before it is tracked; only the newest matters.
      person_poses:
        source: pose/person_poses
        queue_size: 1
    outputs:
      - odom_pose

  # YOLOv8 pose and hailotracker on the Hailo-8.
  - id: pose
    path: ../../dora-hailo-perception/dora_hailo_pose_node.py
    env:
      PYTHONPATH: ../../../lib/dora-rig-messages
    inputs:
      # Only the newest frame matters; an older one waiting here is already late.
      model_input:
        source: camera/model_input
        queue_size: 1
    outputs:
      - person_poses

  # Keypoints and torso in 3D from the frame's depth, placed in the odom frame and smoothed into tracks.
  - id: people
    path: ../../dora-people-3d/target/release/dora-people-3d
    env:
      POSITION_FRAME: odom
    inputs:
      person_poses: pose/person_poses
      depth: camera/depth
      calibration: camera/calibration
      odom_pose:
        source: odometry/odom_pose
        queue_size: 100
    outputs:
      - people_tracks

  # A keyframe at least once a second, sooner on a turn, people cut out of its depth, each led by every IMU sample
  # since the last.
  - id: keyframes
    path: ../target/release/dora-keyframe-selector
    inputs:
      # Every imu message is needed: each keyframe carries all the samples since the last.
      imu:
        source: camera/imu
        queue_size: 1000
      depth:
        source: camera/depth
        queue_size: 4
      color:
        source: camera/color
        queue_size: 4
      calibration:
        source: camera/calibration
        queue_size: 1
      # People cut out of each keyframe's depth, from the poses nearest its time: a second of them may wait.
      person_poses:
        source: pose/person_poses
        queue_size: 30
      # Travel since the last keyframe calls for the next; only the latest pose matters.
      odom_pose:
        source: odometry/odom_pose
        queue_size: 1
    outputs:
      - request_color
      - imu
      - keyframe

  # Every third depth frame, people cut out, halved each way, at the odometry's pose of the depth camera for exactly
  # that frame.
  - id: posed_depth
    path: ../target/release/dora-posed-depth
    inputs:
      depth:
        source: camera/depth
        queue_size: 4
      # Every pose is needed: a chosen frame is sent only with the pose of its own camera time.
      odom_pose:
        source: odometry/odom_pose
        queue_size: 100
      calibration:
        source: camera/calibration
        queue_size: 1
      # The people to cut out of the depth, by the odometry's rule; only the newest matters.
      person_poses:
        source: pose/person_poses
        queue_size: 1
    outputs:
      - posed_depth

  # The people, the odometry, the keyframes and the posed depth frames to the spatial server, which connects here.
  - id: bridge
    path: ../../dora-zenoh-bridge/target/release/dora-zenoh-bridge
    env:
      ZENOH_LISTEN: tcp/0.0.0.0:7447
      ZENOH_PUBLISH: people_tracks=rig/people_tracks,odom_pose=rig/odom_pose,keyframe=rig/keyframe,imu=rig/imu,calibration=rig/calibration,posed_depth=rig/posed_depth
      # A late posed depth frame or people frame is worth nothing: a newer one replaces one still waiting to go out,
      # and the replaced ones are counted in the log. Every other key waits for the Zenoh connection.
      ZENOH_LATEST_ONLY: rig/posed_depth,rig/people_tracks
    inputs:
      people_tracks: people/people_tracks
      # Every pose is needed by the localizer.
      odom_pose:
        source: odometry/odom_pose
        queue_size: 100
      keyframe:
        source: keyframes/keyframe
        queue_size: 8
      calibration: camera/calibration
      imu:
        source: keyframes/imu
        queue_size: 100
      # Only the newest matters.
      posed_depth:
        source: posed_depth/posed_depth
        queue_size: 2
