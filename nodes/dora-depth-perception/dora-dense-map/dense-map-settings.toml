# The dense map's settings, here at their defaults. Every key is optional; a missing key keeps its default.

[tsdf]
voxel_m = 0.05
# Signed distances are clamped to this either side of a surface.
truncation_m = 0.2
observation_weight = 1.0
max_weight = 64.0
# Behind a surface a reading's weight falls away; a voxel with less weight than this counts as never seen.
min_observed_weight = 0.5
min_range_m = 0.4
max_range_m = 5.0
# Every n-th pixel each way casts a ray that decides which blocks a keyframe touches.
allocation_stride_px = 4

[floor]
min_floor_points = 200
fraction_of_peak = 0.3
min_ceiling_height_m = 1.8
min_ceiling_points = 20

[occupancy_grid]
# The height band above the floor that the occupancy grid is sliced through.
band_min_m = 0.05
band_max_m = 0.6
occupied_below_m = 0.025
period_s = 1.0

[mesh]
# The shortest time between two mesh_blocks messages.
period_s = 0.2
# A block is sent again when a vertex moved further than this from where it was last sent,
min_vertex_move_m = 0.02
# or more than this fraction of its cells holding a vertex appeared or went,
min_changed_cells = 0.1
# and no sooner than this after it was last sent.
min_block_period_s = 0.5

[topology]
door_width_m = 1.1
min_rise_m = 0.1
min_door_width_m = 0.5
min_room_area_m2 = 1.5
place_spacing_m = 0.75
min_place_clearance_m = 0.2
max_edge_length_m = 1.5
max_hole_area_m2 = 0.5

[keep_out]
labels = ["glass door", "glass", "window", "mirror", "glass table"]
margin_m = 0.15

[buffers]
max_awaiting_pose = 64

[keyframes]
# Keyframe poses fall in cells this wide along x, y and z, and this wide in yaw; a cell keeps only its newest keyframe.
pose_cell_m = 0.3
pose_cell_yaw_deg = 20.0
# Past this many kept keyframes the oldest with a kept neighbour one cell away goes, or the oldest when none has.
max_kept = 500
# Keyframes no longer kept are remembered by the blocks they were fused into, so a move of one rebuilds those blocks.
max_forgotten_footprints = 20000
# A keyframe that moves less than this and turns less than this is not rebuilt.
rebuild_min_move_m = 0.01
rebuild_min_turn_deg = 0.25
