# The dense map's settings, here at their defaults. Every key is optional; a missing key keeps its default.

[tsdf]
voxel_m = 0.05
# Signed distances are clamped to this either side of a surface.
truncation_m = 0.2
observation_weight = 1.0
max_weight = 64.0
# Behind a surface a reading's weight falls away; a voxel with less weight than this counts as never seen.
min_observed_weight = 0.5
min_range_m = 0.4
max_range_m = 5.0
# Every n-th pixel each way casts a ray that decides which blocks a keyframe touches.
allocation_stride_px = 4

[floor]
min_floor_points = 200
fraction_of_peak = 0.3
min_ceiling_height_m = 1.8
min_ceiling_points = 20

[free_space]
# The height band above the floor that free space is sliced through.
band_min_m = 0.05
band_max_m = 0.6
occupied_below_m = 0.025
period_s = 1.0

[topology]
door_width_m = 1.1
min_rise_m = 0.1
min_door_width_m = 0.5
min_room_area_m2 = 1.5
place_spacing_m = 0.75
min_place_clearance_m = 0.2
max_edge_length_m = 1.5
max_hole_area_m2 = 0.5

[keep_out]
labels = ["glass door", "glass", "window", "mirror", "glass table"]
margin_m = 0.15

[buffers]
max_awaiting_pose = 64
