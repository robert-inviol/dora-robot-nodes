# The spatial server on the mapping machine (strixen): localizer, dense map, object map, the spatial agent and the
# rig view page for people to watch (http://<this machine>:8094), fed live over Zenoh. Keyframes, their IMU,
# odometry, posed depth frames, the camera's calibration and people come from the camera machine's dataflow
# (dora-realsense/examples/pose-dataflow.yml); SAM 3 instance masks come from a GPU machine running the perception
# dataflow with `instance_masks` published to rig/instance_masks; questions come from whichever agent asks them.
# ZENOH_CONNECT is the camera machine's address.
# Paths are relative to this file. Build with `cargo build --release` in nodes/dora-depth-perception,
# nodes/dora-world-agent, nodes/dora-rig-view and nodes/dora-zenoh-bridge before `dora start`.
nodes:
  - id: bridge
    path: ../../dora-zenoh-bridge/target/release/dora-zenoh-bridge
    env:
      ZENOH_CONNECT: tcp/192.0.2.10:7447
      ZENOH_SUBSCRIBE: rig/keyframe=keyframe,rig/imu=imu,rig/instance_masks=instance_masks,rig/spatial_query=spatial_query,rig/goal_status=goal_status,rig/people_tracks=people_tracks,rig/odom_pose=odom_pose,rig/calibration=calibration,rig/posed_depth=posed_depth
      ZENOH_PUBLISH: keyframe_pose=rig/keyframe_pose,occupancy_grid=rig/occupancy_grid,topology=rig/topology,keep_out=rig/keep_out,object_update=rig/object_update,spatial_answer=rig/spatial_answer,nav_goal=rig/nav_goal
    inputs:
      tick: dora/timer/millis/5
      keyframe_pose: localizer/keyframe_pose
      occupancy_grid: dense_map/occupancy_grid
      topology: dense_map/topology
      keep_out: dense_map/keep_out
      object_update: objects/object_update
      spatial_answer: spatial_agent/spatial_answer
      nav_goal: spatial_agent/nav_goal
    outputs:
      - keyframe
      - imu
      - instance_masks
      - spatial_query
      - goal_status
      - people_tracks
      - odom_pose
      - calibration
      - posed_depth

  - id: localizer
    path: ../target/release/dora-map-localizer
    env:
      MAP_LOCALIZER_CONFIG: spatial-server-localizer.toml
      RUST_LOG: info
    inputs:
      keyframe:
        source: bridge/keyframe
        queue_size: 1
      imu:
        source: bridge/imu
        queue_size: 1000
      # Every pose is needed, in camera-time order.
      odom_pose:
        source: bridge/odom_pose
        queue_size: 1000
      # Where the colour camera sits on the IMU; the same message every second.
      calibration:
        source: bridge/calibration
        queue_size: 1
    outputs:
      - keyframe_pose
      - map_to_odom
      - pose_graph_update

  - id: dense_map
    path: ../target/release/dora-dense-map
    env:
      DENSE_MAP_SETTINGS: ../dora-dense-map/dense-map-settings.toml
      RUST_LOG: info
    inputs:
      keyframe:
        source: bridge/keyframe
        queue_size: 32
      keyframe_pose:
        source: localizer/keyframe_pose
        queue_size: 32
      # Keyframes already fused that a pose graph optimization moved.
      pose_graph_update:
        source: localizer/pose_graph_update
        queue_size: 32
      object_update:
        source: objects/object_update
        queue_size: 64
      # Fused as they arrive, at their odometry pose corrected by the latest map_to_odom; only the newest matters.
      posed_depth:
        source: bridge/posed_depth
        queue_size: 2
      map_to_odom: localizer/map_to_odom
      # Collects and starts background rebuilds, meshing (at most every mesh.period_s, 0.2 s) and slicing.
      tick: dora/timer/millis/50
      # The rig view missed a mesh blocks message or joined late: the whole surface goes out as a snapshot.
      mesh_snapshot_request: rig_view/mesh_snapshot_request
    outputs:
      - occupancy_grid
      - topology
      - keep_out
      - mesh_blocks

  - id: objects
    path: ../target/release/dora-object-map
    env:
      OBJECT_MAP_SETTINGS: ../dora-object-map/object-map-settings.toml
      RUST_LOG: info
    inputs:
      keyframe:
        source: bridge/keyframe
        queue_size: 32
      keyframe_pose:
        source: localizer/keyframe_pose
        queue_size: 32
      instance_masks:
        source: bridge/instance_masks
        queue_size: 8
    outputs:
      - object_update

  - id: spatial_agent
    path: ../../dora-world-agent/target/release/dora-world-agent
    env:
      SPATIAL_AGENT_CONFIG: ../../dora-world-agent/world-agent/spatial-agent.example.toml
      RUST_LOG: info
    inputs:
      spatial_query: bridge/spatial_query
      goal_status: bridge/goal_status
      topology: dense_map/topology
      occupancy_grid:
        source: dense_map/occupancy_grid
        queue_size: 1
      object_update:
        source: objects/object_update
        queue_size: 256
      keyframe_pose:
        source: localizer/keyframe_pose
        queue_size: 32
      # People are transformed into the map frame from the odometry frame with the localizer's map_to_odom; until the first
      # correction they are logged and left out.
      people_tracks:
        source: bridge/people_tracks
        queue_size: 8
      map_to_odom: localizer/map_to_odom
    outputs:
      - spatial_answer
      - nav_goal

  # Planes and the room from each keyframe on its own (dora-depth-perception), for the rig view.
  - id: plane_segmentation
    path: ../target/release/dora-depth-perception
    inputs:
      keyframe:
        source: bridge/keyframe
        queue_size: 1
    outputs:
      - room_layout

  - id: rig_view
    path: ../../dora-rig-view/target/release/dora-rig-view
    env:
      # The address the page is served on.
      RIG_VIEW_ADDRESS: "0.0.0.0"
      RIG_VIEW_PORT: "8094"
      RUST_LOG: info
    inputs:
      keyframe:
        source: bridge/keyframe
        queue_size: 4
      keyframe_pose: localizer/keyframe_pose
      pose_graph_update:
        source: localizer/pose_graph_update
        queue_size: 32
      odom_pose:
        source: bridge/odom_pose
        queue_size: 1
      map_to_odom: localizer/map_to_odom
      people_tracks:
        source: bridge/people_tracks
        queue_size: 1
      # Every mesh block is needed: each one is the only message that says how its block looks now. A message the full
      # queue drops shows as a gap in the sequence, and the rig view asks for a snapshot.
      mesh_blocks:
        source: dense_map/mesh_blocks
        queue_size: 32
      object_update:
        source: objects/object_update
        queue_size: 256
      topology: dense_map/topology
      room_layout:
        source: plane_segmentation/room_layout
        queue_size: 1
    outputs:
      # Asks the dense map for its whole surface after a missed mesh blocks message.
      - mesh_snapshot_request
