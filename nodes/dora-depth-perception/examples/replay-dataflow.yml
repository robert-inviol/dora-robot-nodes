# The whole perception pipeline on one machine, fed by a keyframe recording instead of a camera.
# Paths are relative to this file. Build the Rust nodes with `cargo build --release` in the node
# directory, and run `uv sync` in each Python node's directory, before `dora start`.
# With LABELS_BACKEND: api, the labels node needs ANTHROPIC_API_KEY in the environment dora runs in.
nodes:
  - id: replay
    path: ../target/release/dora-keyframe-replay
    env:
      # A recording written by dora-keyframe-selector (KEYFRAME_RECORD_PATH), relative to this file.
      KEYFRAME_RECORDING: recordings/room.arrow
      KEYFRAME_REPLAY_LOOP: "true"
    inputs:
      tick: dora/timer/millis/1000
    outputs:
      - keyframe

  # Names the object types once at the start, then every LABELS_REFRESH_S.
  - id: labels
    path: ../../dora-scene-concepts/.venv/bin/dora-scene-concepts
    env:
      LABELS_MODEL: claude-opus-5-5
      LABELS_BACKEND: claude-cli
      LABELS_REFRESH_S: "600"
    inputs:
      keyframe:
        source: replay/keyframe
        queue_size: 1
    outputs:
      - labels

  # Holds only the newest keyframe, so it never works through a backlog.
  - id: sam3
    path: ../../dora-sam3-segmenter/.venv/bin/dora-sam3-segmenter
    env:
      # Four object types per pass fit a 6 GB GPU.
      SAM3_BATCH_SIZE: "4"
      SAM3_IDLE_LABELS_PER_KEYFRAME: "8"
    inputs:
      keyframe:
        source: replay/keyframe
        queue_size: 1
      labels: labels/labels
    outputs:
      - instance_masks

  - id: plane_segmentation
    path: ../target/release/dora-depth-perception
    inputs:
      keyframe: replay/keyframe
      instance_masks: sam3/instance_masks
    outputs:
      - room_layout
      - scene

  - id: view
    path: ../../dora-scene-view/.venv/bin/dora-scene-view
    env:
      SCENE_VIEW_PORT: "8090"
      SCENE_VIEW_TIMINGS_CSV: /tmp/perception-timings.csv
    inputs:
      # Kept, not just the newest, so the keyframe that instance masks arrive for is still at hand.
      keyframe:
        source: replay/keyframe
        queue_size: 10
      instance_masks:
        source: sam3/instance_masks
        queue_size: 1
      room_layout:
        source: plane_segmentation/room_layout
        queue_size: 1
      scene:
        source: plane_segmentation/scene
        queue_size: 1
      labels:
        source: labels/labels
        queue_size: 1
