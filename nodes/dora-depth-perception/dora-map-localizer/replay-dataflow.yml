# Localizes a keyframe recording made with its IMU recording beside it. Paths are relative to this file.
# Build with `cargo build --release` in the node directory before `dora start`.
nodes:
  - id: replay
    path: ../target/release/dora-keyframe-replay
    env:
      KEYFRAME_RECORDING: ../examples/recordings/room.arrow
      # The localizer needs the imu message leading up to each keyframe.
      IMU_RECORDING: ../examples/recordings/room-imu.arrow
    inputs:
      tick: dora/timer/millis/600
    outputs:
      - keyframe
      - imu

  - id: localizer
    path: ../target/release/dora-map-localizer
    env:
      MAP_LOCALIZER_CONFIG: map-localizer.example.toml
    inputs:
      # Only the newest keyframe is worth localizing.
      keyframe:
        source: replay/keyframe
        queue_size: 1
      # Every imu message is needed: the gyro integrates all of them.
      imu:
        source: replay/imu
        queue_size: 1000
      # With an [odometry] section in the settings, the robot's odometry, and the map_to_odom output below:
      # odom_pose:
      #   source: <odometry node>/odom_pose
      #   queue_size: 1000
    outputs:
      - keyframe_pose
      # - map_to_odom
