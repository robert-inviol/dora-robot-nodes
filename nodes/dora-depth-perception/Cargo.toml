[workspace]
resolver = "3"
members = ["depth-perception", "perception-wire", "dora-depth-perception", "dora-keyframe-replay", "room-map", "depth-inertial-odometry"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# The node API has to match the version of the dora CLI that runs the dataflow.
dora-node-api = { version = "=0.3.13", default-features = false }
eyre = "0.6"

[profile.release]
strip = true
debug = "line-tables-only"

[profile.bench]
debug = "line-tables-only"
